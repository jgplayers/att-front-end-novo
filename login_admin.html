<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login Admin</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="login-container">
    <h1>⚙️ Login Administrativo</h1>

    <!-- Mensagem de erro (exemplo estático) -->
    <p class="erro">Usuário ou senha inválidos!</p>

    <form method="POST" class="login-form">
      <label for="usuario">Usuário:</label>
      <input type="text" id="usuario" name="usuario" required>

      <label for="senha">Senha:</label>
      <input type="password" id="senha" name="senha" required>

      <button type="submit">Entrar</button>
    </form>

    <!-- 🔗 Botão para cadastro de admin -->
    <div class="cadastro-link">
      <p>Não tem conta de administrador?</p>
      <a href="cadastro_admin.html" class="btn-cadastro">Cadastrar Admin</a>
    </div>
  </div>
</body>
</html>
